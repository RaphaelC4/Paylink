[toolchain]
# Host-neutral, download-free: only the channel. Pinning a host triple here
# (e.g. the gnu variant of one Windows box) makes rustup refuse this file on
# every other machine, and listing components/targets forces rustup to fetch
# them from static.rust-lang.org even when a checker only wants `cargo test`.
# Building wasm instead needs: rustup target add wasm32-unknown-unknown
channel = "stable"
