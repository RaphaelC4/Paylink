name = "paylink-parse"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The browser origins allowed to call this Worker: production first, then the
# stable staging Preview alias. Comma-separated, exact match per entry.
# "*" works for local testing but lets any page spend your Gemini quota.
[vars]
ALLOWED_ORIGIN = "https://paylink-near.vercel.app,https://paylink-git-staging-raphael-c4.vercel.app"
# gemini-2.5-flash is deprecated and API access is limited to existing users.
# 3.5 Flash-Lite is Google's own migration target and is free-tier eligible.
GEMINI_MODEL = "gemini-3.5-flash-lite"

# The key itself is a secret, never a var:
#   npx wrangler secret put GEMINI_API_KEY

# Durable rate limiting (M-02): 10 requests / 60 s per IP, counted by
# Cloudflare across isolates (the in-code window is only the fallback for
# dashboard-paste deploys, which cannot attach bindings). Applied by
# `wrangler deploy` only — the name must match env.RATE_LIMITER in the code,
# and namespace_id must be unique within the account. period must be 10 or 60.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 10
  period = 60
