# Paylink claim keeper — Cloudflare Worker.
#
# Scans the contract's state for links stuck in PAID and releases them by
# calling `claim`. The contract makes `claim` callable by anyone, so this
# Worker needs no cooperation from either side: it pays gas from its own
# testnet account and the payout always lands on the link's creator.
name = "paylink-keeper"
main = "src/index.js"
compatibility_date = "2026-10-01"

# The settler: release anything sitting in PAID, every minute. The frontend
# never asks anyone to sign the release — after one payment approval it only
# watches PAID → CLAIMED — so this cron is the automatic path, and the pay
# card's Release button is the manual fallback for the rare failed sweep.
[triggers]
crons = ["* * * * *"]

[vars]
ALLOWED_ORIGIN = "*"
# FastNEAR, not rpc.testnet.near.org: the old endpoint is deprecated and
# measured 3.6-6.1s here vs 0.6-1.3s. Same reasoning as frontend/config.js.
RPC_URL = "https://test.rpc.fastnear.com"
# Optional (L-08 P1): comma-separated FALLBACKS for READS only — tried in
# order, each independently (a past success promises nothing about the next
# one), stopping at the first that answers. Broadcasts always go to
# RPC_URL alone, exactly once — never retried, never failed over. Public
# testnet endpoints from NEAR's provider table (docs.near.org/api/rpc/
# providers); no SLA is assumed for any of them. Omit = previous behaviour.
RPC_URLS = "https://near-testnet.drpc.org, https://testnet-rpc.intea.rs"
CONTRACT_ID = "paylink-v2.testnet"
KEEPER_ACCOUNT = "paylink-keeper.testnet"

# Secrets — never vars, never committed:
#   npx wrangler secret put KEEPER_KEY      (ed25519 secret key of KEEPER_ACCOUNT)
#   npx wrangler secret put TICK_SECRET     (header x-tick-secret for POST /tick)
