# Paylink continuous integration — audit finding M-03.
#
# Every command here is documented in README.md ("Development") or ships with
# the Parse Worker: nothing is invented, nothing is skipped, nothing is
# deployed. All suites are self-contained (mocked RPC, keys generated per
# run, throwaway literals), so this workflow needs NO repository secrets and
# no production credentials, and it prints none. Permissions are read-only;
# there are no wrangler / near / deploy steps anywhere below.
#
# Triggers: pull requests targeting master or staging; pushes to staging.
# Actions are pinned to full commit SHAs; the release tag is kept in a
# trailing comment so upgrades stay reviewable.

name: CI

on:
  pull_request:
    branches:
      - master
      - staging
  push:
    branches:
      - staging

# Least privilege: this workflow only reads the repository.
permissions:
  contents: read

# One run per branch; a newer push cancels the in-flight run of the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── item 3 (formatting) + item 4 (syntax / static checks) ────────────────
  static:
    name: Formatting & syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after checkout runs git; keep the token off disk

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: JavaScript syntax (node --check)
        # Parses every worker/frontend source and test file; all failures are
        # collected and annotated on the PR instead of stopping at the first.
        run: |
          set -euo pipefail
          status=0
          for f in \
            workers/relayer/src/index.js \
            workers/relayer/test/parse.test.mjs \
            workers/keeper/src/index.js \
            workers/keeper/test/sweep.test.mjs \
            workers/parse/src/index.js \
            workers/parse/test/parse.test.mjs \
            frontend/app.js \
            frontend/config.js \
            frontend/tidepool.js \
            frontend/receipt.js \
            frontend/test/one-approval.test.mjs \
            frontend/test/parse-errors.test.mjs \
            frontend/test/rpc-retry.test.mjs \
            frontend/test/relayer-fallback.test.mjs \
            frontend/test/tidepool-discovery.test.mjs \
            frontend/test/tidepool-quote.test.mjs \
            frontend/test/tidepool-status.test.mjs \
            frontend/test/tidepool-polling.test.mjs \
            frontend/test/tidepool-deposit.test.mjs \
            frontend/test/tidepool-regression.test.mjs \
            frontend/test/receipt.test.mjs \
            workers/tidepool/src/index.js \
            workers/tidepool/test/networks.test.mjs \
            workers/tidepool/test/quote.test.mjs \
            workers/tidepool/test/status.test.mjs \
            workers/tidepool/test/payout.test.mjs \
            workers/tidepool/test/records.test.mjs
          do
            if node --check "$f"; then
              echo "ok  node --check $f"
            else
              echo "::error file=$f::JavaScript syntax check failed"
              status=1
            fi
          done
          exit $status

      - name: Rust formatting (cargo fmt --check)
        # rust-toolchain.toml pins channel=stable; the runner's rustup picks
        # it up. The crate formats clean as of M-03 — this keeps it clean.
        working-directory: contracts/paylink-contract
        run: |
          set -euo pipefail
          rustup component add rustfmt
          cargo fmt --check

  # ── item 5 (contract tests) ──────────────────────────────────────────────
  contract:
    name: Contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after checkout runs git; keep the token off disk

      - name: Install nasm (README prerequisite — aws-lc-sys host builds)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y nasm

      - name: Cache Rust registry and build output
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: contracts/paylink-contract

      - name: cargo test --lib (56 host tests)
        working-directory: contracts/paylink-contract
        run: cargo test --lib

  # ── item 6 (relayer tests) ───────────────────────────────────────────────
  relayer:
    name: Relayer tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after checkout runs git; keep the token off disk

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      # No install step: README — "the three JS suites — no dependencies,
      # plain node". There is no node_modules and nothing to cache.
      - name: node workers/relayer/test/parse.test.mjs
        run: node workers/relayer/test/parse.test.mjs

  # ── item 7 (keeper tests) ────────────────────────────────────────────────
  keeper:
    name: Keeper tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after checkout runs git; keep the token off disk

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: node workers/keeper/test/sweep.test.mjs
        run: node workers/keeper/test/sweep.test.mjs

  # ── item 8 (frontend tests and build) ────────────────────────────────────
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after checkout runs git; keep the token off disk

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Build check — static site, no bundler (by design)
        # README: "frontend (static, no build step)". No build command
        # exists, so CI verifies the files the page loads are all present
        # rather than inventing a bundler; their syntax is parsed in the
        # Formatting & syntax job.
        run: |
          set -euo pipefail
          for f in frontend/index.html frontend/app.js frontend/config.js frontend/tidepool.js frontend/receipt.js frontend/styles.css; do
            if [ ! -f "$f" ]; then
              echo "::error file=$f::required frontend file is missing"
              exit 1
            fi
          done
          echo "static site files present — no build step exists by design"

      - name: node frontend/test/one-approval.test.mjs
        run: node frontend/test/one-approval.test.mjs

      - name: node frontend/test/parse-errors.test.mjs
        run: node frontend/test/parse-errors.test.mjs

      - name: node frontend/test/rpc-retry.test.mjs
        run: node frontend/test/rpc-retry.test.mjs

      - name: node frontend/test/relayer-fallback.test.mjs
        run: node frontend/test/relayer-fallback.test.mjs

      # Phase 7 — the cross-chain rail (six suites, same plain-Node harness).
      - name: node frontend/test/tidepool-discovery.test.mjs
        run: node frontend/test/tidepool-discovery.test.mjs

      - name: node frontend/test/tidepool-quote.test.mjs
        run: node frontend/test/tidepool-quote.test.mjs

      - name: node frontend/test/tidepool-status.test.mjs
        run: node frontend/test/tidepool-status.test.mjs

      - name: node frontend/test/tidepool-polling.test.mjs
        run: node frontend/test/tidepool-polling.test.mjs

      - name: node frontend/test/tidepool-deposit.test.mjs
        run: node frontend/test/tidepool-deposit.test.mjs

      - name: node frontend/test/tidepool-regression.test.mjs
        run: node frontend/test/tidepool-regression.test.mjs

      # Verifiable receipt — PDF bytes, single success surface, card wiring.
      - name: node frontend/test/receipt.test.mjs
        run: node frontend/test/receipt.test.mjs

  # ── item 9 (parse worker tests) ──────────────────────────────────────────
  parse:
    name: Parse tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after checkout runs git; keep the token off disk

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: node workers/parse/test/parse.test.mjs
        run: node workers/parse/test/parse.test.mjs

  # ── Tidepool integration worker tests (Phases 3–6) ─────────────────────
  # Same rules as every job above: no install step (all five suites are
  # plain node with no dependencies), mocked upstream only, no secrets,
  # nothing deployed. quote.test.mjs signs its own fixtures with per-run
  # Ed25519 keys; the real-signature fixtures inside it are static
  # payloads. status.test.mjs (Phase 4) drives GET /status against the
  # same mocks: seven Tidepool statuses, polling bounds, the race
  # detector and leak sweeps. payout.test.mjs (Phase 5) drives
  # SETTLED -> VERIFIED against mocked NEAR tx_status evidence.
  # records.test.mjs (Phase 6) drives record integrity and reconciliation
  # hardening: validation/quarantine of corrupt persisted records,
  # persist-before-complete conflicts, interrupted-write recovery,
  # honoured upstream Retry-After, DO-reactivation recovery and the
  # no-evidence-never-VERIFIED sweeps.
  tidepool:
    name: Tidepool tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing after checkout runs git; keep the token off disk

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: node workers/tidepool/test/networks.test.mjs
        run: node workers/tidepool/test/networks.test.mjs

      - name: node workers/tidepool/test/quote.test.mjs
        run: node workers/tidepool/test/quote.test.mjs

      - name: node workers/tidepool/test/status.test.mjs
        run: node workers/tidepool/test/status.test.mjs

      # Phase 5: independent payout verification. SETTLED -> VERIFIED only
      # on authoritative NEAR tx evidence (exact recipient/token/amount,
      # fresh get_link immediately before the move) — every incomplete or
      # contradictory evidence path must hold, and the cross-provider
      # invoice_paid race must be recorded and never auto-verified.
      - name: node workers/tidepool/test/payout.test.mjs
        run: node workers/tidepool/test/payout.test.mjs

      # Phase 6: payment records + reconciliation hardening. Persisted
      # records are type/shape-validated before they are served or acted
      # on (hold / quarantine, never a silent repair), a detected conflict
      # survives an interrupted cycle, upstream Retry-After is honoured on
      # the reconcile path, and no flow can reach VERIFIED without the
      # full Phase 5 evidence.
      - name: node workers/tidepool/test/records.test.mjs
        run: node workers/tidepool/test/records.test.mjs
